name: Publish verified Master Miao 1.6.2
on:
  push:
    branches: [main]
    paths: ['releases/v1.6.2/**', '.github/workflows/publish-162.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify installer checksum
        working-directory: releases/v1.6.2
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish verified installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.6.2 >/dev/null 2>&1 || gh release create v1.6.2 --target "$GITHUB_SHA" --title "喵师傅 1.6.2 — 孔识别与盲孔标注修复" --notes-file releases/v1.6.2/README.md
          gh release upload v1.6.2 releases/v1.6.2/MasterMiao-1.6.2-Setup-x64.exe releases/v1.6.2/SHA256SUMS.txt --clobber
