name: Publish verified Master Miao 1.4.9
on:
  push:
    branches: [main]
    paths: ['releases/v1.4.9/**', '.github/workflows/publish-149.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify installer checksum
        working-directory: releases/v1.4.9
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish verified installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.4.9 >/dev/null 2>&1 || gh release create v1.4.9 --target "$GITHUB_SHA" --title "喵师傅 1.4.9 — PCB 单实体修复" --notes-file releases/v1.4.9/README.md
          gh release upload v1.4.9 releases/v1.4.9/MasterMiao-1.4.9-Setup-x64.exe releases/v1.4.9/SHA256SUMS.txt --clobber
