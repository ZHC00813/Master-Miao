name: Publish verified Master Miao 1.4.10
on:
  push:
    branches: [main]
    paths: ['releases/v1.4.10/**', '.github/workflows/publish-1410.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify installer checksum
        working-directory: releases/v1.4.10
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish verified installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.4.10 >/dev/null 2>&1 || gh release create v1.4.10 --target "$GITHUB_SHA" --title "喵师傅 1.4.10 — PCB 极致轻量" --notes-file releases/v1.4.10/README.md
          gh release upload v1.4.10 releases/v1.4.10/MasterMiao-1.4.10-Setup-x64.exe releases/v1.4.10/SHA256SUMS.txt --clobber
